<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JIU Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: clipboard-style work board — sticky toolbar, roster grid with sticky name column + day headers, labor rail at the bottom. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eef1ed; --surface-3:#e4e9e3; --line:#d9dfd8; --line-2:#c7cfc6;
  --ink:#16201b; --muted:#5d6a63; --faint:#8a968f;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#d9eee6; --accent-2:#134a3d;
  --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#b3261e; --bad-bg:#fde6e3; --good:#1c7240; --good-bg:#e0f3e6; --info:#2a5db0; --info-bg:#e5eefc;
  --draft:#7a5cc2; --draft-bg:#efe9fb; --off-a:#f6e6e3; --off-b:#fbf1ef; --shadow:0 10px 30px rgba(20,35,28,.16); --scrim:rgba(14,22,18,.45);
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif; --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --surface-2:#1d2622; --surface-3:#25302b; --line:#2b3732; --line-2:#3a4741;
  --ink:#e4ebe7; --muted:#9eaca5; --faint:#738079;
  --accent:#4cbf9c; --accent-ink:#06261d; --accent-soft:#183a30; --accent-2:#8fdcc2;
  --warn:#f0b04a; --warn-bg:#3a2a0e; --bad:#ff8a80; --bad-bg:#3d1a17; --good:#6fd394; --good-bg:#16331f; --info:#8db4ff; --info-bg:#182742;
  --draft:#b9a3f0; --draft-bg:#2a2140; --off-a:#2f201e; --off-b:#261b19; --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --surface-2:#1d2622; --surface-3:#25302b; --line:#2b3732; --line-2:#3a4741;
  --ink:#e4ebe7; --muted:#9eaca5; --faint:#738079;
  --accent:#4cbf9c; --accent-ink:#06261d; --accent-soft:#183a30; --accent-2:#8fdcc2;
  --warn:#f0b04a; --warn-bg:#3a2a0e; --bad:#ff8a80; --bad-bg:#3d1a17; --good:#6fd394; --good-bg:#16331f; --info:#8db4ff; --info-bg:#182742;
  --draft:#b9a3f0; --draft-bg:#2a2140; --off-a:#2f201e; --off-b:#261b19; --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td,.t{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.lg{height:48px;padding:0 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:36px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:34px;padding:0 13px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.inp,select.inp,textarea.inp{height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;width:100%;color:var(--ink);font-weight:500;font-size:14px}
textarea.inp{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.spacer{flex:1}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.draft{background:var(--draft-bg);color:var(--draft)} .pill.neutral{background:var(--surface-3);color:var(--muted)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none;background-size:cover;background-position:center}
.av.photo{color:transparent}
.brand-logo{height:30px;max-width:130px;object-fit:contain;border-radius:6px;flex:none}
.picbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-prev{height:64px;max-width:220px;object-fit:contain;border:1px dashed var(--line-2);border-radius:10px;padding:6px;background:var(--surface-2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);outline:2px solid transparent;cursor:pointer}
.swatches button.on{outline-color:var(--ink)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px}
.brand-mark i{background:var(--accent-ink);border-radius:1px;opacity:.9}.brand-mark i:nth-child(2n){opacity:.45}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:transparent;height:36px;padding:0 12px;border-radius:var(--r-sm);font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.nav button.on{background:var(--accent-soft);color:var(--accent-2)}
:root[data-theme="dark"] .nav button.on{color:var(--accent)}
.store-sel{max-width:240px}
@media (max-width:820px){.nav{order:5;width:100%}.store-sel{max-width:170px}}
main{padding-block:14px 40px}
.demo-bar{background:var(--draft-bg);color:var(--draft);font-size:12.5px;font-weight:600}
.demo-bar .gut{padding-block:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.datebox{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);height:36px}
.datebox button{border:0;background:transparent;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--muted)}
.datebox span{padding:0 8px;font-weight:600;white-space:nowrap}
.pubbtn.clean{background:var(--surface-2);color:var(--muted);border-color:var(--line)}

/* roster grid */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 220px);min-height:320px}
.grid{display:grid;grid-template-columns:200px repeat(7,minmax(122px,1fr));min-width:1060px}
.grid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.gh{position:sticky;top:0;z-index:5;background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.gh.today{background:var(--accent-soft)}
.gh .d1{font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px}
.gh .d2{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.gh .menu-btn{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1}
.gh .menu-btn:hover{background:var(--surface-3)}
.corner{position:sticky;left:0;top:0;z-index:7;background:var(--surface);padding:8px}
.name{position:sticky;left:0;z-index:3;background:var(--surface);padding:8px 10px;display:flex;align-items:center;gap:9px}
.name .nm{font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name .sub{font-size:11.5px;color:var(--muted)}
.band{grid-column:1/-1;padding:5px 10px;font-weight:700;font-size:12.5px;color:#fff;position:sticky;left:0;letter-spacing:.02em}
.band.dark{background:var(--ink);color:var(--bg)}
.lane{grid-column:1/-1;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 10px}
.cell{position:relative;padding:4px;display:flex;flex-direction:column;gap:4px;min-height:52px;cursor:pointer}
.cell:hover{background:var(--surface-2)}
.cell.drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-3px}
.cell .plus{position:absolute;right:6px;bottom:4px;font-size:18px;color:var(--faint);opacity:0}
.cell:hover .plus{opacity:1}
.cell.unavail{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 12px)}
.cell .ua{font-size:11px;color:var(--faint);font-weight:600}
.chip{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);overflow:hidden;min-height:28px;cursor:grab;position:relative;font-size:13px}
.chip .tag{width:20px;flex:none;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.chip .tx{padding:4px 7px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chip .tx small{display:block;font-weight:500;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.chip.draft{border-style:dashed;border-color:var(--draft);background:var(--draft-bg)}
.chip .wf{position:absolute;right:0;top:0;width:0;height:0;border-style:solid;border-width:0 11px 11px 0}
.chip .wf.bad{border-color:transparent var(--bad) transparent transparent}
.chip .wf.warn{border-color:transparent var(--warn) transparent transparent}
.chip .wf.info{border-color:transparent var(--info) transparent transparent}
.chip.swap::after{content:"⇄";position:absolute;right:5px;bottom:3px;font-size:11px;color:var(--warn);font-weight:700}
.chip:hover{border-color:var(--accent)}
.chip.dragging{opacity:.4}
.off{border-radius:6px;padding:4px 7px;font-size:12px;font-weight:600;color:var(--bad);background:repeating-linear-gradient(135deg,var(--off-a) 0 6px,var(--off-b) 6px 12px)}
.off.pending{color:var(--warn);background:repeating-linear-gradient(135deg,var(--warn-bg) 0 6px,var(--surface) 6px 12px)}
.ev{font-size:12px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--info-bg);color:var(--info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:2px solid var(--line-2)!important;padding:6px 8px;display:flex;align-items:center;gap:6px;justify-content:space-between;cursor:pointer}
.foot.corner2{left:0;z-index:6}
.foot .lab{display:flex;flex-direction:column;align-items:flex-end;font-size:11.5px;line-height:1.25;color:var(--muted)}
.foot .lab b{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* day view */
.dayview{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dv{min-width:900px}
.dv-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--line);min-height:44px}
.dv-row .name{border-right:1px solid var(--line)}
.dv-track{position:relative;cursor:pointer;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--hrs)) 100%}
.dv-bar{position:absolute;top:7px;bottom:7px;border-radius:6px;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.dv-bar.draft{outline:2px dashed var(--draft);outline-offset:1px}
.dv-off{position:absolute;top:4px;bottom:4px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--off-a) 0 6px,var(--off-b) 6px 12px);color:var(--bad);font-size:11px;font-weight:700;padding:3px 7px}
.dv-head{position:sticky;top:0;z-index:2;background:var(--surface)}
.dv-hours{display:grid;font-size:11px;color:var(--muted);font-weight:600}
.dv-hours span{padding:6px 4px;border-left:1px solid var(--line)}
.cov{display:grid;font-size:11.5px;font-weight:700;text-align:center}
.cov span{padding:5px 0;border-left:1px solid var(--surface)}

/* lists / tables */
.list{display:flex;flex-direction:column;gap:10px}
.req{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
@media (max-width:640px){.req{grid-template-columns:auto 1fr}.req .acts{grid-column:1/-1}}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.conf{margin-top:6px;font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:6px 8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:720px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.sub td{background:var(--surface-2);font-weight:700}
.tbl tr.grp td{background:var(--surface);font-weight:700;border-bottom:1px solid var(--line-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.availgrid td{text-align:center;font-size:12.5px;white-space:nowrap}
.availgrid td:first-child{text-align:left}
.a-none{color:var(--bad);font-weight:700}.a-range{color:var(--warn);font-weight:600}.a-all{color:var(--faint)}

/* modal, menu, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:520px;margin-top:4vh;display:flex;flex-direction:column}
.modal.wide{max-width:760px}
.modal-h{padding:16px 18px 6px;display:flex;align-items:center;gap:10px}
.modal-b{padding:10px 18px 4px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:14px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px}
.menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:500;gap:8px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toasts{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.warnlist{display:flex;flex-direction:column;gap:6px}
.warnlist div{font-size:13px;padding:7px 10px;border-radius:7px}
.warnlist .bad{background:var(--bad-bg);color:var(--bad)}.warnlist .warn{background:var(--warn-bg);color:var(--warn)}.warnlist .info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.qchip{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.qchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick label{border:1px solid var(--line-2);border-radius:8px;padding:6px 2px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.daypick label.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.daypick label.dis{opacity:.35;cursor:default}
.daypick input{display:none}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){.busy{animation:none;background:var(--accent)}}

/* auth / kiosk */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-block:30px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px}
.demo-logins{display:grid;gap:8px}
.demo-logins button{justify-content:space-between;white-space:normal;height:auto;min-height:40px;padding:8px 12px;flex-wrap:wrap;text-align:left}
.sec-h .seg{max-width:100%;overflow-x:auto}
.kiosk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:24px;text-align:center}
.kiosk .clock{font-family:var(--f-display);font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}

var kioskTimer = null;
function showKiosk(k) {

    var st = { phone: '', pin: '', step: 'phone' };

      var who = st.who;
      $('#app').innerHTML = demoBar() + '<div class="kiosk gut"><div>' + brand() + '</div><div class="muted" style="font-weight:600">' + esc(info.store) + '</div><div class="clock" id="kclock"></div><div class="muted" id="kdate"></div>' +
        (msg ? '<div class="card" style="font-size:18px;font-weight:700;color:' + (kind === 'bad' ? 'var(--bad)' : 'var(--good)') + '">' + esc(msg) + '</div>' : '') +
        (who ? '<div class="card col" style="min-width:300px"><h2>Hi, ' + esc(who.name.split(' ')[0]) + '</h2><div class="muted">' + (who.state === 'out' ? (who.shift ? 'Your shift today: ' + who.shift : 'No shift on the schedule today') : who.state === 'break' ? 'You are on break' : 'Clocked in since ' + H.fmt12(who.since.slice(11))) + '</div><div class="row" style="justify-content:center">' +

          '<button class="btn lg" data-k="cancel">Cancel</button></div></div>'
          : '<div class="kiosk-form col" style="align-items:center"><div class="muted">' + (st.step === 'phone' ? 'Enter your phone number' : 'Enter your PIN') + '</div><div class="entry">' + (st.step === 'phone' ? (fmtPhone(st.phone) || '&nbsp;') : (st.pin.replace(/./g, '●') || '&nbsp;')) + '</div>' +
            '<div class="pad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '→'].map(function (x) { return '<button data-p="' + x + '">' + x + '</button>'; }).join('') + '</div></div>') +

    else if (d.kind === 'timeoff' && d.isMine && !S.me.perms.owner && (d.status === 'pending' || d.status === 'cancelReq')) f = '<div class="dfoot"><div class="pill neutral" style="justify-content:center;height:36px">Waiting for a manager</div></div>';
    var m = modal({ title: d.kind === 'timeoff' ? 'Time off details' : d.title + ' details', body: b, foot: f || '<button class="btn" data-xd>Close</button>', wide: true, noFocus: true });

    if ($('[data-xd]', m.el)) $('[data-xd]', m.el).onclick = m.close;
    function done(msg) { return function () { toast(msg); m.close(); if (after) after(); }; }
    $$('[data-dgo]', m.el).forEach(function (btn) {

    if ($('[data-dcan]', m.el)) $('[data-dcan]', m.el).onclick = function () { run(api('cancelSwap', { id: d.id })).then(done('Request cancelled')); };
  });

// ===== Screens for: team board, checklists, recurring shifts, auto-fill, forecast, reminders, devices, backup =====
function devStr() { try { return navigator.userAgent || ''; } catch (e) { return ''; } }
function timeAgo(t) {
  if (!t) return ''; var n = H.absStr(nowStr()), m = n - H.absStr(t);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; if (m < 1440) return Math.floor(m / 60) + ' h ago';
  return H.prettyD(t.slice(0, 10)) + ' ' + H.fmt12(t.slice(11, 16));
}
function linkify(t) { return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>'); }

// ---------- data export and closing the account ----------
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportAll() {
  toast('Getting your data…');
  api('exportData').then(function (d) {
    var stamp = String(d.at || '').slice(0, 10), base = String(d.name || 'data').replace(/[^\w-]+/g, '_') + '_' + stamp;
    function files() { var o = {}; Object.keys(d.tables).forEach(function (n) { var t = d.tables[n]; o[n + '.csv'] = [t.cols.map(csvCell).join(',')].concat(t.rows.map(function (r) { return r.map(csvCell).join(','); })).join('\r\n'); }); return o; }
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js').then(function () {
      var z = new JSZip(), f = files(); Object.keys(f).forEach(function (n) { z.file(n, f[n]); });
      z.file('README.txt', 'All data for ' + d.name + ', downloaded ' + d.at + '.\nEach file is one table and opens in Excel or Google Sheets.\nPINs and login details are not included.');
      return z.generateAsync({ type: 'blob' }).then(function (b) { download(base + '.zip', b); toast('Downloaded'); });
    }).catch(function () { download(base + '.json', new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' })); toast('Downloaded'); });

// ---------- import a list of employees ----------
function parseEmpList(txt) {
  var rows = [];
  String(txt || '').split(/\r?\n/).forEach(function (line) {
    if (!line.trim()) return; var c = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(',')).map(function (x) { return x.trim().replace(/^"|"$/g, ''); });
    if (/^name$/i.test(c[0])) return;
    var r = { name: c[0] || '', phone: '', email: '', position: '', wage: '' };
    c.slice(1).forEach(function (x) { if (!x) return; if (/@/.test(x)) r.email = x; else if (x.replace(/\D/g, '').length >= 10 && !r.phone) r.phone = x; else if (/^\$?\d+(\.\d+)?$/.test(x)) r.wage = x.replace('$', ''); else if (!r.position) r.position = x; });
    rows.push(r);
  });
  return rows;
}

          '<textarea class="inp t" readonly style="min-height:110px">' + esc('Your ' + r.business.name + ' schedule app\nLink: ' + (r.link || '(set up the website first)') + '\nPhone: ' + fmtPhone(r.business.ownerPhone) + '\nPIN: ' + r.pin + '\nThe first time you log in on a new device we email you a 6-digit code.') + '</textarea>' +

function crSet(el) {

  el.innerHTML = '<div class="card col" style="max-width:760px"><h2>Platform settings</h2><div class="g2"><label class="f">Your email (daily summary, alerts)<input class="inp" name="creatorEmail" value="' + esc(s.creatorEmail) + '"></label><label class="f">Support email (shown to businesses)<input class="inp" name="supportEmail" value="' + esc(s.supportEmail) + '"></label>' +

    '<div class="card col" style="max-width:760px;margin-top:12px"><h2>Stripe (automatic payments)</h2><p class="small muted" style="margin:0">Paste a <b>restricted key</b> from Stripe → Developers → API keys with read access to Events. The app checks for new payments every 15 minutes and updates each business by itself.</p>' +

    '<label class="f">' + (s.stripeSet ? 'Replace key' : 'Stripe key') + '<input class="inp t" type="password" name="stripeKey" autocomplete="off" placeholder="rk_live_…"></label><label class="chk"><input type="checkbox" name="autoStripe"' + (s.autoStripe ? ' checked' : '') + '> Check Stripe automatically</label>' +
    '<div class="row" style="flex-wrap:wrap"><button class="btn pri" id="stSave">Save Stripe</button><button class="btn" id="stCheck">Check now</button>' + (s.stripeSet ? '<button class="btn danger" id="stDel">Remove key</button>' : '') + '</div></div>' +
    '<div class="card col" style="max-width:760px;margin-top:12px"><h2>Reminders</h2><p class="small muted" style="margin:0">Every morning the app emails owners about trials ending and payments due or late, and sends you a summary. Emails left today: ' + esc(q == null ? '?' : q) + '.</p><div><button class="btn" id="rdGo">Send reminders now</button></div></div>';

// ===== Installed-app (PWA) helpers: offline shell, install button, iPhone tips =====
(function () {
  var deferred = null;
  function standalone() { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
  function ios() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  if ('serviceWorker' in navigator) window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) { try { toast('App updated. Reopen to use the newest version.'); } catch (e) { } } });
      });
    }).catch(function () { });
  });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; refresh(); });
  window.addEventListener('appinstalled', function () { deferred = null; refresh(); try { toast('Installed! Open it from your home screen.'); } catch (e) { } });
  function dismissed() { try { return localStorage.getItem('sb_install_hide') === '1'; } catch (e) { return false; } }
  window.installHintHtml = function (force) {
    if (standalone() || (!force && dismissed())) return '';
    var how = deferred ? '<button class="btn pri sm" data-install>Install app</button>'
      : ios() ? '<span class="small">Tap <b>Share</b> <span aria-hidden="true">⬆︎</span> then <b>Add to Home Screen</b>.</span>'
      : '<span class="small">Open your browser menu <b>⋮</b> and tap <b>Install app</b> or <b>Add to Home screen</b>.</span>';
    return '<div class="card install-hint" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)">' +
      '<img src="icon-192.png" alt="" width="40" height="40" style="border-radius:10px;flex:none">' +
      '<div style="flex:1;min-width:180px"><b>Get the app on your phone</b><div class="muted small">Opens full screen from your home screen, like any app.</div><div style="margin-top:6px">' + how + '</div></div>' +
      (force ? '' : '<button class="btn ghost sm" data-install-x aria-label="Hide">✕</button>') + '</div>';
  };
  window.wireInstallHint = function (root) {
    root = root || document;
    Array.prototype.forEach.call(root.querySelectorAll('[data-install]'), function (b) { b.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; refresh(); }); }; });
    Array.prototype.forEach.call(root.querySelectorAll('[data-install-x]'), function (b) { b.onclick = function () { try { localStorage.setItem('sb_install_hide', '1'); } catch (e) { } var c = b.closest('.install-hint'); if (c) c.remove(); }; });
  };
  function refresh() { Array.prototype.forEach.call(document.querySelectorAll('.install-hint'), function (c) { var force = !c.querySelector('[data-install-x]'); var h = window.installHintHtml(force); if (!h) { c.remove(); return; } var d = document.createElement('div'); d.innerHTML = h; c.replaceWith(d.firstChild); }); window.wireInstallHint(); }
  // show the hint on the login screen and on the More screens
  function after(name, place) {
    var f = window[name]; if (typeof f !== 'function') return;
    window[name] = function () { var r = f.apply(this, arguments); try { place(); } catch (e) { } return r; };
  }
  after('showLogin', function () { var c = document.querySelector('.auth-card'); var h = window.installHintHtml(false); if (c && h) { c.insertAdjacentHTML('afterend', '<div style="width:100%;max-width:400px;margin-top:12px">' + h + '</div>'); window.wireInstallHint(); } });
  function moreHint() { var m = document.getElementById('main'), h = window.installHintHtml(true); if (m && h && !m.querySelector('.install-hint')) { m.insertAdjacentHTML('afterbegin', '<div style="margin-bottom:12px">' + h + '</div>'); window.wireInstallHint(m); } }
  after('empMore', moreHint); after('renderMgrMore', moreHint);
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
